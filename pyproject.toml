[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-job-copilot"
version = "0.1.0"
description = "Local-first multi-user job search copilot with scraping, scoring, dashboarding, and automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "requests>=2.31.0",
  "streamlit>=1.35.0",
  "plotly>=5.24.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.7.0",
  "pre-commit>=4.0.0",
]

[project.scripts]
pmcopilot-run-daily = "src.run_daily:main"
pmcopilot-run-hourly = "src.run_hourly:main"
pmcopilot-validate-targets = "src.validate_targets:main"
pmcopilot-dashboard = "src.dashboard:main"
pmcopilot-email-digest = "src.email_digest:main"
pmcopilot-healthcheck = "src.healthcheck:main"
pmcopilot-retry-latest-failed = "src.retry_failed_runs:main"

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "__pycache__", "outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W"]
