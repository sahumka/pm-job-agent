name: Daily Job Search

on:
  schedule:
    # Run at both UTC candidates and gate to 8 AM America/Los_Angeles in-step (handles DST).
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Optional single profile id (blank = active/default behavior)"
        required: false
        default: ""
      skip_digest:
        description: "Skip email digest generation"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate schedule to 8 AM Pacific
        id: tz_gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR_PT=$(TZ=America/Los_Angeles date +%H)
            if [ "$HOUR_PT" != "08" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping non-8AM Pacific trigger."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Prepare directories
        if: steps.tz_gate.outputs.skip != 'true'
        run: |
          mkdir -p data outputs

      - name: Restore persisted DB cache
        if: steps.tz_gate.outputs.skip != 'true'
        id: db-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/jobs.db
          key: jobsdb-${{ runner.os }}-${{ github.ref_name }}-daily-${{ github.run_id }}
          restore-keys: |
            jobsdb-${{ runner.os }}-${{ github.ref_name }}-daily-
            jobsdb-${{ runner.os }}-${{ github.ref_name }}-hourly-
            jobsdb-${{ runner.os }}-${{ github.ref_name }}-

      - name: Set up Python
        if: steps.tz_gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.tz_gate.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        if: steps.tz_gate.outputs.skip != 'true'
        env:
          PROFILE_INPUT: ${{ github.event.inputs.profile }}
          SKIP_DIGEST_INPUT: ${{ github.event.inputs.skip_digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.run_daily import run_daily

          profile = (os.getenv("PROFILE_INPUT", "") or "").strip() or None
          skip_digest = str(os.getenv("SKIP_DIGEST_INPUT", "false")).strip().lower() == "true"
          summary = run_daily(
              companies_csv="config/target_companies.csv",
              linkedin_csv="config/linkedin_jobs.csv",
              manual_jobs_csv="config/manual_jobs.csv",
              db_path="data/jobs.db",
              user_id=profile,
              timeout=20,
              skip_digest=skip_digest,
          )
          out = Path("outputs/daily_summary.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Write schedule skip summary
        if: steps.tz_gate.outputs.skip == 'true'
        run: |
          echo "## Daily Job Search Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: this schedule trigger was not at 8:00 AM America/Los_Angeles." >> "$GITHUB_STEP_SUMMARY"

      - name: Write run summary
        if: always() && steps.tz_gate.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("outputs/daily_summary.json")
          if not p.exists():
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
                  "## Daily Job Search Summary\n\nNo summary file found.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          s = json.loads(p.read_text(encoding="utf-8"))
          lines = []
          lines.append("## Daily Job Search Summary")
          lines.append("")
          lines.append(f"- Companies processed: **{s.get('companies_processed', 0)}**")
          lines.append(f"- Jobs scraped: **{s.get('jobs_scraped', 0)}**")
          lines.append(f"- Jobs matched role filter: **{s.get('jobs_matched_role_filter', 0)}**")
          lines.append(f"- Jobs inserted: **{s.get('jobs_inserted', 0)}**")
          lines.append(f"- Duplicates skipped: **{s.get('duplicates_skipped', 0)}**")
          lines.append(f"- Errors: **{s.get('errors', 0)}**")
          lines.append(f"- Digest generated: **{s.get('digest_generated', False)}**")
          lines.append(f"- Email sent: **{s.get('email_sent', False)}**")
          email_error = str(s.get('email_error', '') or '').strip()
          if email_error:
              lines.append(f"- Email error: `{email_error}`")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Daily summary written.")
          PY

      - name: Save persisted DB cache
        if: always() && steps.tz_gate.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs.db
          key: jobsdb-${{ runner.os }}-${{ github.ref_name }}-daily-${{ github.run_id }}

      - name: Upload artifacts
        if: always() && steps.tz_gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-search-${{ github.run_id }}
          path: |
            data/jobs.db
            outputs/daily_digest.html
            outputs/daily_summary.json
            outputs/source_health.csv
            outputs/source_health.json
          if-no-files-found: warn
