name: Hourly Job Collection

on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      profiles:
        description: "Optional comma-separated profile ids (blank = all)"
        required: false
        default: ""
      disable_notifications:
        description: "Disable start/1-hour/end email notifications"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hourly-job-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize stale-run gate
        id: stale_gate
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "age_minutes=0" >> "$GITHUB_OUTPUT"

      - name: Skip stale scheduled run (>20 min queue delay)
        if: github.event_name == 'schedule'
        id: stale_gate_schedule
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          run_id = os.environ["GH_RUN_ID"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              payload = json.loads(resp.read().decode("utf-8"))

          created_at = str(payload.get("created_at", "")).strip()
          created_dt = datetime.strptime(created_at, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
          now_dt = datetime.now(timezone.utc)
          age_minutes = int((now_dt - created_dt).total_seconds() // 60)
          should_skip = age_minutes > 20

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"skip={'true' if should_skip else 'false'}\n")
              f.write(f"age_minutes={age_minutes}\n")
          print(f"Run age: {age_minutes} minutes | skip={should_skip}")
          PY

      - name: Write stale-run skip summary
        if: steps.stale_gate_schedule.outputs.skip == 'true'
        run: |
          echo "## Hourly Job Collection Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped stale scheduled run due to queue delay." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run age: **${{ steps.stale_gate_schedule.outputs.age_minutes }} minutes**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Threshold: **20 minutes**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next scheduled run will continue as normal." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare directories
        if: steps.stale_gate_schedule.outputs.skip != 'true'
        run: |
          mkdir -p data outputs

      - name: Restore persisted DB cache
        if: steps.stale_gate_schedule.outputs.skip != 'true'
        id: db-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/jobs.db
            outputs/hourly_summary.json
          key: jobsdb-${{ runner.os }}-${{ github.ref_name }}-hourly-${{ github.run_id }}
          restore-keys: |
            jobsdb-${{ runner.os }}-${{ github.ref_name }}-hourly-
            jobsdb-${{ runner.os }}-${{ github.ref_name }}-

      - name: Set up Python
        if: steps.stale_gate_schedule.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.stale_gate_schedule.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hourly collection
        if: steps.stale_gate_schedule.outputs.skip != 'true'
        env:
          PROFILES: ${{ github.event.inputs.profiles }}
          DISABLE_NOTIFICATIONS: ${{ github.event.inputs.disable_notifications }}
          SOURCE_AUTO_DISABLE_EMPTY: "false"
        run: |
          notify_flag=""
          if [ "${DISABLE_NOTIFICATIONS}" = "true" ]; then
            notify_flag="--disable-notifications"
          fi

          if [ -n "$PROFILES" ]; then
            python -m src.workflow_runner \
              --companies-csv config/target_companies.csv \
              --linkedin-csv config/linkedin_jobs.csv \
              --manual-jobs-csv config/manual_jobs.csv \
              --profiles "$PROFILES" \
              --db-path data/jobs.db \
              --summary-path outputs/hourly_summary.json \
              --midpoint-seconds 3600 \
              ${notify_flag}
          else
            python -m src.workflow_runner \
              --companies-csv config/target_companies.csv \
              --linkedin-csv config/linkedin_jobs.csv \
              --manual-jobs-csv config/manual_jobs.csv \
              --db-path data/jobs.db \
              --summary-path outputs/hourly_summary.json \
              --midpoint-seconds 3600 \
              ${notify_flag}
          fi

      - name: Write run summary
        if: always() && steps.stale_gate_schedule.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("outputs/hourly_summary.json")
          if not p.exists():
              step_summary = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
              step_summary.write_text("## Hourly Job Collection Summary\n\nNo summary file found.\n", encoding="utf-8")
              print("No hourly summary file found.")
              raise SystemExit(0)

          data = json.loads(p.read_text(encoding="utf-8"))
          totals = data.get("totals", {})
          runs = data.get("profile_runs", [])
          skipped = data.get("profiles_skipped", [])
          failed = [r for r in runs if str(r.get("status", "")).lower() != "success"]
          succeeded = [r for r in runs if str(r.get("status", "")).lower() == "success"]

          lines = []
          lines.append("## Hourly Job Collection Summary")
          lines.append("")
          lines.append(f"- Profiles requested: **{len(data.get('profiles_requested', []))}**")
          lines.append(f"- Profiles skipped (inactive/not configured): **{len(skipped)}**")
          lines.append(f"- Profiles succeeded: **{totals.get('profiles_succeeded', len(succeeded))}**")
          lines.append(f"- Profiles failed: **{totals.get('profiles_failed', len(failed))}**")
          lines.append(f"- Jobs inserted: **{totals.get('jobs_inserted', 0)}**")
          lines.append(f"- High-quality inserted (>=4.0): **{totals.get('high_quality_inserted', 0)}**")
          lines.append(f"- Duplicates skipped: **{totals.get('duplicates_skipped', 0)}**")
          lines.append(f"- Errors: **{totals.get('errors', 0)}**")
          lines.append("")
          lines.append("### Profile outcomes")
          lines.append("")
          lines.append("| Profile | Status | Inserted | High-Quality | Duplicates | Errors |")
          lines.append("|---|---:|---:|---:|---:|---:|")
          for r in runs[:50]:
              s = r.get("summary", {}) or {}
              lines.append(
                  f"| {r.get('profile_id','')} | {r.get('status','')} | "
                  f"{s.get('jobs_inserted', 0)} | {s.get('high_quality_inserted', 0)} | {s.get('duplicates_skipped', 0)} | {s.get('errors', 0)} |"
              )
          if not runs:
              lines.append("| (none) | - | - | - | - | - |")

          if skipped:
              lines.append("")
              lines.append("### Skipped profiles")
              lines.append("")
              lines.append("| Profile | Configured | Crawl Active | Reason |")
              lines.append("|---|---:|---:|---|")
              for item in skipped[:50]:
                  lines.append(
                      f"| {item.get('profile_id','')} | {item.get('configured', False)} | {item.get('crawl_active', False)} | {item.get('reason','')} |"
                  )

          step_summary = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          step_summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Hourly summary written.")
          PY

      - name: Save persisted DB cache
        if: always() && steps.stale_gate_schedule.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs.db
            outputs/hourly_summary.json
          key: jobsdb-${{ runner.os }}-${{ github.ref_name }}-hourly-${{ github.run_id }}

      - name: Upload artifacts
        if: always() && steps.stale_gate_schedule.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hourly-job-collection-${{ github.run_id }}
          path: |
            data/jobs.db
            outputs/hourly_summary.json
            outputs/source_health.csv
            outputs/source_health.json
          if-no-files-found: warn
